user www-data;
worker_processes 4;
pid /run/nginx.pid;
daemon off;

events {
  worker_connections  2048;
  multi_accept on;
  use epoll;
}

http {
  # Disable server type advertising
  server_tokens off;
  # Enable receiving files
  sendfile on;
  #
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15;
  types_hash_max_size 2048;
  client_max_body_size 2048M;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr;
  gzip on;
  gzip_disable "msie6";

  # Set real IP from trusted proxies (Docker internal networks)
  set_real_ip_from 213.255.246.7;
  set_real_ip_from 185.139.7.204;
  set_real_ip_from 2a12:ab46:5344:13::a;
  set_real_ip_from 2a0a:8dc0:6::a;
  set_real_ip_from 10.0.0.0/8;       # Private IPv4 range
  set_real_ip_from 172.16.0.0/12;    # Private IPv4 range
  set_real_ip_from 192.168.0.0/16;   # Private IPv4 range
  set_real_ip_from fc00::/7;         # Unique Local Address (ULA) IPv6 range
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # SSL Configs
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
  ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS';

  # Rate Limiting

  ## Request Limiting
  limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;
  limit_req_status 444;

  include /etc/nginx/snippets/block_bots.conf;
  include /etc/nginx/snippets/block_scanners.conf;

  open_file_cache off; # Disabled for issue 619
  charset UTF-8;
  include /etc/nginx/conf.d/*.conf;
}
